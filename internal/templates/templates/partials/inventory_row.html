<tr id="inventory-row-{{.ID}}">
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="text-sm font-medium text-gray-900 dark:text-gray-100">{{.Name}}</div>
        <div class="text-sm text-gray-500 dark:text-gray-400">{{.ID}}</div>
    </td>
    <td class="px-6 py-4">
        <div class="text-sm text-gray-900 dark:text-gray-100 truncate max-w-xs" title="{{.Path}}">{{.Path}}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full {{stateClass (printf "%s" .State)}}">
            {{stateLabel (printf "%s" .State)}}
        </span>
        {{if .Error}}
        <div class="text-xs text-red-600 dark:text-red-400 mt-1" title="{{.Error}}">Error</div>
        {{end}}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
        {{if .NodeCount}}{{formatCount .NodeCount}}{{else}}-{{end}}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
        {{if .HasTierData}}Yes{{else}}No{{end}}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
        {{if .State.IsNotLoaded}}
        <button type="button"
            hx-post="/partials/inventories/{{.ID}}/load"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-indicator="#spinner-{{.ID}}"
            class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-900 dark:hover:text-indigo-200">
            Load
        </button>
        {{else if .State.IsLoaded}}
        <button type="button"
            hx-post="/partials/inventories/{{.ID}}/unload"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-indicator="#spinner-{{.ID}}"
            class="text-yellow-600 dark:text-yellow-400 hover:text-yellow-900 dark:hover:text-yellow-200">
            Unload
        </button>
        {{else if .State.IsError}}
        <button type="button"
            hx-post="/partials/inventories/{{.ID}}/load"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-indicator="#spinner-{{.ID}}"
            class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-900 dark:hover:text-indigo-200">
            Reload
        </button>
        {{end}}
        <button type="button"
            hx-delete="/partials/inventories/{{.ID}}"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-confirm="Are you sure you want to delete this inventory?"
            class="text-red-600 dark:text-red-400 hover:text-red-900 dark:hover:text-red-200">
            Delete
        </button>
        <span id="spinner-{{.ID}}" class="htmx-indicator text-xs text-gray-400 dark:text-gray-500" role="status">
            <span aria-hidden="true">…</span><span class="sr-only">Working</span>
        </span>
    </td>
</tr>
