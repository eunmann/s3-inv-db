<tr id="discovered-row-{{.SourceBucket}}-{{.InventoryID}}">
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="text-sm font-medium text-gray-900">{{.SourceBucket}} / {{.InventoryID}}</div>
        <div class="text-xs text-gray-500 font-mono truncate max-w-md" title="{{.ManifestKey}}">{{.ManifestKey}}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        {{if .LatestRun}}{{.LatestRun}}{{else}}<span class="text-red-600">no runs</span>{{end}}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{.FileFormat}}</td>
    <td class="px-6 py-4 whitespace-nowrap">
        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full {{stateClass (printf "%s" .State)}}">
            {{.State}}
        </span>
        {{if .Error}}
        <div class="text-xs text-red-600 mt-1" title="{{.Error}}">Error</div>
        {{end}}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        {{if .NodeCount}}{{formatCount .NodeCount}}{{else}}-{{end}}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
        {{if .State.CanLoad}}
        <button type="button"
            hx-post="/partials/discovered/{{.SourceBucket}}/{{.InventoryID}}/load"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-indicator="#spinner-{{.SourceBucket}}-{{.InventoryID}}"
            class="text-indigo-600 hover:text-indigo-900">
            {{if .State.IsPending}}Build &amp; Load{{else}}Reload{{end}}
        </button>
        {{else if .State.IsLoaded}}
        <button type="button"
            hx-post="/partials/discovered/{{.SourceBucket}}/{{.InventoryID}}/unload"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-indicator="#spinner-{{.SourceBucket}}-{{.InventoryID}}"
            class="text-yellow-600 hover:text-yellow-900">
            Unload
        </button>
        {{end}}
        <button type="button"
            hx-delete="/partials/discovered/{{.SourceBucket}}/{{.InventoryID}}"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-confirm="Evict cached index? The S3 source is untouched; you can re-load."
            class="text-red-600 hover:text-red-900">
            Evict
        </button>
        <span id="spinner-{{.SourceBucket}}-{{.InventoryID}}" class="htmx-indicator text-xs text-gray-400" role="status">
            <span aria-hidden="true">…</span><span class="sr-only">Working</span>
        </span>
    </td>
</tr>
