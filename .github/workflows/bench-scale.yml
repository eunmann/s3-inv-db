name: Bench Scale

# Weekly A/B of the scale suite (bench/suite/scale.txt: 10M-object builds,
# large indexes) between main and main as of a week earlier, to catch
# drift the per-PR 1M fixtures can't show. Both sides run on the same
# runner in the same job, interleaved, so the runner's speed cancels out.
# A regression past the gate's thresholds fails the run; the reports are
# kept as an artifact either way. Not a merge gate.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref (default: main as of 7 days ago)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scale:
    name: Scale suite (week over week)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Pick the base commit
        id: base
        env:
          INPUT_BASE: ${{ inputs.base }}
        run: |
          base="$INPUT_BASE"
          if [ -z "$base" ]; then
            base=$(git rev-list -1 --before="7 days ago" HEAD)
          fi
          if [ -z "$base" ] || [ "$(git rev-parse "$base")" = "$(git rev-parse HEAD)" ]; then
            echo "No commits since the base; nothing to compare."
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ref=$base" >>"$GITHUB_OUTPUT"
          echo "skip=false" >>"$GITHUB_OUTPUT"
          echo "Comparing $(git rev-parse --short "$base") with $(git rev-parse --short HEAD)"
      - name: Scale A/B
        if: steps.base.outputs.skip == 'false'
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: make bench-scale BASE="$BASE_REF"
      - name: Keep the reports
        if: ${{ always() && steps.base.outputs.skip == 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-scale-${{ github.run_id }}
          path: bench/ab/
          if-no-files-found: warn
