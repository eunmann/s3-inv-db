# docker compose for s3-inv-db.
#
# Profiles:
#   dev   - air-driven hot-reload server, source bind-mounted (port 8080).
#           Pulls MinIO + minio-setup along for the ride so the server can
#           discover and load inventories from a simulated S3.
#   prod  - slim multi-stage image to validate production builds (port 8081
#           so dev and prod can run side by side).
#   seed  - one-shot inventory generator that uploads simulated S3 inventory
#           layouts to MinIO. Invoke with:
#               docker compose -f infra/docker-compose.yml \
#                 --profile seed run --rm seeder

services:
  # MinIO simulates S3 for dev and integration tests. UsePathStyle=true is
  # mandatory on the client side; the AWS SDK defaults to virtual-host style
  # which MinIO rejects.
  minio:
    profiles: [dev, seed]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${S3INV_MINIO_PORT:-9000}:9000"
      - "${S3INV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-setup:
    profiles: [dev, seed]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/s3-inv;
      echo 'bucket s3-inv ready';
      exit 0;
      "

  server-dev:
    profiles: [dev]
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    ports:
      - "${S3INV_DEV_PORT:-8080}:8080"
    volumes:
      - ..:/app                                # source for hot-reload
      - /app/tmp                               # keep air's tmp/ inside the container
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - server-cache:/cache                    # built indexes downloaded from S3
    environment:
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      S3INV_SOURCE: s3://s3-inv/inventory-data/
      S3INV_CACHE_DIR: /cache
    depends_on:
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  server:
    profiles: [prod]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "${S3INV_PROD_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  seeder:
    profiles: [seed]
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    entrypoint: []
    command:
      - go
      - run
      - ./cmd/s3-inv-db-seeder
      - --target=s3
      - --s3-bucket=s3-inv
      - --s3-prefix=inventory-data/
      - --count=${S3INV_SEED_COUNT:-3}
      - --runs-per-inventory=${S3INV_SEED_RUNS:-4}
      - --objects=${S3INV_SEED_OBJECTS:-5000}
      - --preset=${S3INV_SEED_PRESET:-realistic}
      - --pretty-logs
    environment:
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes:
      - ..:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

volumes:
  go-mod-cache:
  go-build-cache:
  minio-data:
  server-cache:
