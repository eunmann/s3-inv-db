# docker compose for s3-inv-db.
#
# Profiles:
#   dev   - air-driven hot-reload server, source bind-mounted (port 8080).
#           Pulls the local S3 server + s3-setup along for the ride so the
#           server can discover and load inventories from a simulated S3.
#   prod  - slim multi-stage image to validate production builds (port 8081
#           so dev and prod can run side by side).
#   seed  - one-shot inventory generator that uploads simulated S3 inventory
#           layouts to the local S3 server. Invoke with:
#               docker compose -f infra/docker-compose.yml \
#                 --profile seed run --rm seeder
#   test  - the full suite (-tags integration) against an internal-only
#           S3 server. No host ports, so it runs side-by-side with `dev`
#           without collision. Invoke via `make test`.
#
# The local S3 server is versitygw (Apache-2.0) with its posix backend.
# MinIO's images were withdrawn from Docker Hub, so nothing here depends
# on them. Credentials are dev-only placeholders.

services:
  # Local S3 for dev and integration tests. UsePathStyle=true is mandatory
  # on the client side; the AWS SDK defaults to virtual-host style, which
  # local S3 servers reject.
  s3:
    profiles: [dev, seed]
    image: &s3-image versity/versitygw:v1.10.0
    command: &s3-command ["--port", ":9000", "--access", "devaccess", "--secret", "devsecret", "posix", "/data"]
    ports:
      - "${S3INV_S3_PORT:-9000}:9000"
    volumes:
      - s3-data:/data
    healthcheck: &s3-healthcheck
      # Any HTTP response (an unauthenticated request gets 403) means the
      # gateway is serving; busybox wget prints the status line on error.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/ 2>&1 | grep -q HTTP/"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Creates the dev bucket with a SigV4-signed PUT; 409 means it already
  # exists from a previous run.
  s3-setup:
    profiles: [dev, seed]
    image: curlimages/curl:8.23.0
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT
      --aws-sigv4 'aws:amz:us-east-1:s3' --user devaccess:devsecret
      http://s3:9000/s3-inv);
      case $$code in 200|409) echo 'bucket s3-inv ready';; *) echo \"create bucket: HTTP $$code\"; exit 1;; esac
      "

  server-dev:
    profiles: [dev]
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    # Air rebuilds the binary on source changes; arguments after `--`
    # are forwarded to the rebuilt server binary on every restart.
    command: ["air", "-c", ".air.toml", "--", "--s3-source=s3://s3-inv/inventory-data/", "--cache-dir=/cache"]
    ports:
      - "${S3INV_DEV_PORT:-8080}:8080"
    volumes:
      - ..:/app                                # source for hot-reload
      - /app/tmp                               # keep air's tmp/ inside the container
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - server-cache:/cache                    # built indexes downloaded from S3
    environment:
      AWS_ENDPOINT_URL_S3: http://s3:9000
      AWS_ACCESS_KEY_ID: devaccess
      AWS_SECRET_ACCESS_KEY: devsecret
      AWS_REGION: us-east-1
    depends_on:
      s3:
        condition: service_healthy
      s3-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  server:
    profiles: [prod]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "${S3INV_PROD_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  seeder:
    profiles: [seed]
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    entrypoint: []
    command:
      - go
      - run
      - ./cmd/s3-inv-db-seeder
      - --target=s3
      - --s3-bucket=s3-inv
      - --s3-prefix=inventory-data/
      - --count=${S3INV_SEED_COUNT:-3}
      - --runs-per-inventory=${S3INV_SEED_RUNS:-4}
      - --objects=${S3INV_SEED_OBJECTS:-5000}
      # Mixed sizes give the UI a visible load progression: inv-001 is
      # tiny (instant), inv-002 is mid (hundreds of ms), inv-003 is
      # large (seconds — the spinner + stage labels actually appear).
      # Override with S3INV_SEED_OBJECTS_PER_CONFIG=a,b,c, or set it to
      # empty string to fall back to --objects for every config.
      - --objects-per-config=${S3INV_SEED_OBJECTS_PER_CONFIG-5000,250000,2500000}
      - --preset=${S3INV_SEED_PRESET:-realistic}
      - --pretty-logs
    environment:
      AWS_ENDPOINT_URL_S3: http://s3:9000
      AWS_ACCESS_KEY_ID: devaccess
      AWS_SECRET_ACCESS_KEY: devsecret
      AWS_REGION: us-east-1
    volumes:
      - ..:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      s3:
        condition: service_healthy
      s3-setup:
        condition: service_completed_successfully

  # ----- test profile -----------------------------------------------------
  # Internal-only S3 server for the integration test suite. No host port
  # mapping so this runs alongside `dev` without competing for 9000.
  # Storage is a tmpfs — every `make test` boots from an empty namespace.
  s3-test:
    profiles: [test]
    image: *s3-image
    command: *s3-command
    tmpfs:
      - /data
    healthcheck: *s3-healthcheck

  # Runs the full suite, including the `integration`-tagged tests, against
  # s3-test.
  test-runner:
    profiles: [test]
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    entrypoint: []
    command: ["go", "test", "-tags", "integration", "./..."]
    environment:
      AWS_ENDPOINT_URL_S3: http://s3-test:9000
      AWS_ACCESS_KEY_ID: devaccess
      AWS_SECRET_ACCESS_KEY: devsecret
      AWS_REGION: us-east-1
      GOFLAGS: -count=1
    volumes:
      - ..:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      s3-test:
        condition: service_healthy

volumes:
  go-mod-cache:
  go-build-cache:
  s3-data:
  server-cache:
