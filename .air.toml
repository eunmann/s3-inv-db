root = "."
tmp_dir = "tmp"

[build]
  cmd = "make css && go build -o ./tmp/s3-inv-db-server ./cmd/s3-inv-db-server"
  bin = "./tmp/s3-inv-db-server"
  delay = 1000
  exclude_dir = ["bin", "tmp", "vendor", ".git", "seed-data"]
  # tailwind.css is excluded — it's regenerated by `make css` and would loop.
  exclude_regex = ["_test\\.go$", "tailwind\\.css$"]
  include_ext = ["go", "html", "tmpl", "css", "js"]
  kill_delay = "2s"

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
