version: "2"

linters:
  default: all
  disable:
    # Style preferences / noise the project explicitly does not enforce.
    - lll              # line length
    - wsl              # whitespace
    - wsl_v5
    - varnamelen       # variable-name length is context-dependent
    - tagliatelle      # struct-tag case
    - paralleltest     # not every test wants t.Parallel()
    - exhaustruct      # struct-field exhaustive init is too strict
    - canonicalheader  # HTTP header canonicalisation noise
    - noinlineerr      # idiomatic Go uses inline `if err := ...; err != nil`
    - funcorder        # method ordering
    - nlreturn         # mandatory blank line before return
    # Framework-specific linters not used here.
    - ginkgolinter     # Ginkgo/Gomega
    - promlinter       # Prometheus metric naming
  settings:
    cyclop:
      max-complexity: 25
      package-average: 15.0
    funlen:
      lines: 120
      statements: 80
      ignore-comments: true
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 20
    interfacebloat:
      max: 20
    nestif:
      min-complexity: 6
    maintidx:
      under: 20
    gosec:
      excludes:
        - G104 # errcheck already covers unchecked errors and gives better context
        - G115 # integer overflow conversion is excessively noisy; reviewed by hand at conversion sites
        - G404 # math/rand is fine for synthetic data and non-crypto IDs
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "4"
        - "8"
        - "10"
        - "16"
        - "24"
        - "32"
        - "60"
        - "64"
        - "100"
        - "128"
        - "256"
        - "1000"
        - "1024"
      ignored-functions:
        - strconv.FormatInt
        - strconv.FormatUint
        - strconv.ParseFloat
        - strconv.ParseInt
        - strconv.ParseUint
        - time.Duration
        - context.WithTimeout
    exhaustive:
      default-signifies-exhaustive: true
    godot:
      scope: declarations
      capital: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: "io/ioutil"
              desc: "Use io and os packages instead"
            - pkg: "github.com/pkg/errors"
              desc: "Use standard library errors package with fmt.Errorf"
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - io.Reader
        - io.Writer
        - io.ReadCloser
        - io.WriteCloser
        - io.ReadWriter
        - io.ReaderAt
        - io.Closer
        - context.Context
        # Polymorphic factories defined in this repo.
        - github.com/eunmann/s3-inv-db/pkg/inventory\.InventoryReader
        - github.com/eunmann/s3-inv-db/pkg/extsort\.RunReader
        - github.com/eunmann/s3-inv-db/pkg/extsort\.mergeOutputWriter
        - github.com/eunmann/s3-inv-db/pkg/indexread\.Iterator
    testifylint:
      enable-all: true

  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      # CLI binaries use fmt.Println/Print* legitimately.
      - path: "cmd/"
        linters:
          - forbidigo
      # Test files: relax complexity / unused-param / errcheck thresholds.
      - path: _test\.go
        linters:
          - unparam
          - funlen
          - gocognit
          - gocyclo
          - cyclop
          - maintidx
          - nestif
          - errcheck
          - dupl
          - gochecknoglobals
          - gosmopolitan
      # context.TODO is fine in tests.
      - path: _test\.go
        text: "context.TODO"
      # Dot-imports are fine in tests (e.g. testify suite helpers).
      - path: _test\.go
        linters:
          - revive
        text: "dot-imports"
      # InventoryReader is the canonical public API name.
      - path: pkg/inventory/unified\.go
        linters:
          - revive
        text: "InventoryReader"
      # Zstd encoder/decoder pools must live at package scope to be shared
      # across all run-file writers/readers; that cross-instance reuse is
      # the entire point of the pool.
      - path: pkg/extsort/zstd_pool\.go
        linters:
          - gochecknoglobals
      # Package "format" is an established public API; the var-naming rule
      # flags it as shadowing go/format, but renaming would break every
      # importer of pkg/format.
      - path: pkg/format/
        linters:
          - revive
        text: "var-naming: avoid package names that conflict"
      # White-box tests in extsort/format/templates exercise unexported
      # types (mergeHeap, singleRunIterator, objectBatch, prefixStatsSize,
      # depth-index helpers, etc.) that are intentionally not part of the
      # public API. Moving them to *_test packages would require leaking
      # internals through an export_test.go shim across many files.
      - path: pkg/extsort/.*_test\.go
        linters:
          - testpackage
      - path: pkg/format/.*_test\.go
        linters:
          - testpackage
      - path: internal/templates/.*_test\.go
        linters:
          - testpackage

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true
  go: "1.25"
